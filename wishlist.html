<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Saved Wishlist - Shree Aura Cottons</title>
    <meta name="theme-color" content="#7A1C2C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shree Aura">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- MAIN HEADER -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="brand-logo" title="Shree Aura Cottons">
                <div class="brand-logo-badge">
                    <img src="assets/logo.png" alt="Shree Aura Cottons Logo" class="brand-logo-img" onError="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="brand-logo-icon" style="display:none;">S</div>
                </div>
                <div class="brand-text-container">
                    <span class="brand-text-main">SHREE AURA</span>
                    <div class="brand-text-sub-wrap">
                        <span class="brand-text-sub">COTTON SAREES</span>
                    </div>
                </div>
            </a>

            <div class="header-actions">
                <a href="login.html" class="icon-btn" title="Account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Account</span>
                </a>
                <a href="wishlist.html" class="icon-btn" title="Wishlist">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                    <span>Wishlist</span>
                    <span class="badge" id="wishlistCountBadge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="icon-btn" title="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>Cart</span>
                    <span class="badge" id="cartCountBadge" style="display:none;">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container" style="margin: 3rem auto 5rem;">
        <h1 style="font-family:var(--font-heading); font-size:2.4rem; color:var(--primary-maroon); margin-bottom:1.5rem; font-weight:800;">My Saved Wishlist ♡</h1>

        <div class="product-grid" id="wishlistGrid">
            <!-- Populated via JS -->
        </div>
    </main>

    <script type="module">
        import { getWishlist, toggleWishlist } from './js/wishlist.js';
        import { addToCart } from './js/cart.js';

        function renderWishlistPage() {
            const list = getWishlist();
            const grid = document.getElementById('wishlistGrid');

            if (!grid) return;

            if (list.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:4rem; background:var(--bg-white); border-radius:var(--radius-md); border:2px solid var(--border-color);">
                        <h3 style="font-family:var(--font-heading); font-size:1.8rem; color:var(--primary-maroon); margin-bottom:0.5rem; font-weight:800;">Your Wishlist is Empty</h3>
                        <p style="color:var(--text-muted); margin-bottom:1.5rem; font-weight:500;">Tap the heart icon on any saree to save it for later.</p>
                        <a href="shop.html" class="btn btn-primary">EXPLORE SAREES</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(item => `
                <div class="product-card">
                    <div class="product-image-wrap">
                        <img src="${item.main_image}" alt="${item.name}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title"><a href="product.html?id=${item.id}">${item.name}</a></h3>
                        <div class="price-row" style="margin-bottom:0.8rem;">
                            <span class="sale-price">₹${Number(item.price).toLocaleString('en-IN')}</span>
                            ${item.compare_price ? `<span class="old-price">₹${Number(item.compare_price).toLocaleString('en-IN')}</span>` : ''}
                        </div>
                        <button class="btn btn-primary" onclick="moveToCart('${item.id}')" style="width:100%; font-size:0.8rem; padding:0.55rem;">MOVE TO CART</button>
                        <button onclick="removeWishlistItem('${item.id}')" style="margin-top:0.4rem; color:red; font-size:0.8rem; font-weight:600; text-align:center; width:100%;">Remove from wishlist</button>
                    </div>
                </div>
            `).join('');
        }

        window.moveToCart = function(id) {
            const list = getWishlist();
            const item = list.find(x => x.id === id);
            if (item) {
                addToCart(item, 1);
                toggleWishlist(item);
                renderWishlistPage();
            }
        };

        window.removeWishlistItem = function(id) {
            const list = getWishlist();
            const item = list.find(x => x.id === id);
            if (item) {
                toggleWishlist(item);
                renderWishlistPage();
            }
        };

        document.addEventListener('DOMContentLoaded', renderWishlistPage);
    </script>
    <script type="module" src="js/mobile.js"></script>
</body>
</html>
