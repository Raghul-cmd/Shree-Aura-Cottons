<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - Weaves Saree Collections Admin</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">
            <div class="admin-logo-badge">
                <img src="../assets/logo.png" alt="Weaves Saree Collections Logo" class="admin-logo-img" onError="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="admin-logo-icon" style="display:none;">W</div>
            </div>
            <div class="admin-brand-text-container">
                <span class="admin-brand-text-main">WEAVES</span>
                <span class="admin-brand-text-sub">SAREE COLLECTIONS ADMIN</span>
            </div>
        </div>
        <ul class="admin-menu">
            <li class="admin-menu-item"><a href="index.html">📊 Dashboard</a></li>
            <li class="admin-menu-item"><a href="products.html">👗 Products Catalog</a></li>
            <li class="admin-menu-item"><a href="add-product.html">➕ Add New Saree</a></li>
            <li class="admin-menu-item"><a href="categories.html">🏷️ Categories</a></li>
            <li class="admin-menu-item active"><a href="orders.html">📦 Customer Orders</a></li>
            <li class="admin-menu-item"><a href="customers.html">👥 Customers Directory</a></li>
            <li class="admin-menu-item" style="margin-top:auto;"><a href="#" id="adminLogoutBtn" style="color:var(--admin-danger);">🚪 Logout</a></li>
        </ul>
    </aside>

    <div class="admin-main-wrapper">
        <header class="admin-header">
            <div class="admin-header-title"><h2>Customer Order Management</h2></div>
        </header>

        <main class="admin-content">
            <div class="admin-card">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer & Location</th>
                            <th>Total Amount</th>
                            <th>Payment Status</th>
                            <th>Order Fulfillment Status</th>
                            <th>Order Date</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersTbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin.js"></script>
</body>
</html>
