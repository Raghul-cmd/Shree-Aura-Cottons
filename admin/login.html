<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Weaves Saree Collections</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:var(--admin-sidebar-bg); display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:'Inter', sans-serif;">

    <div style="background:#FFFFFF; border-radius:14px; padding:2.5rem; width:100%; max-width:420px; box-shadow:0 25px 30px -5px rgba(0,0,0,0.4); border:2px solid var(--admin-gold);">
        <div style="text-align:center; margin-bottom:1.5rem;">
            <div style="display:inline-flex; align-items:center; justify-content:center; margin-bottom:0.75rem;">
                <img src="../assets/logo.png" alt="Weaves Saree Collections Logo" style="width:60px; height:60px; object-fit:contain; border-radius:50%; box-shadow:0 4px 10px rgba(0,0,0,0.15);" onError="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="admin-logo-icon" style="display:none; width:54px; height:54px; font-size:1.75rem;">W</div>
            </div>
            <h2 style="color:var(--admin-primary); font-size:1.6rem; font-weight:900; font-family:'Cinzel', serif; letter-spacing:1.5px; margin:0;">WEAVES</h2>
            <p style="color:var(--admin-gold); font-size:0.75rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; margin-top:0.25rem;">◆ SAREE COLLECTIONS ADMIN ◆</p>
            <p style="color:var(--admin-text-sub); font-size:0.82rem; font-weight:500; margin-top:0.5rem;">Sign in to access store inventory & orders</p>
        </div>

        <form id="adminLoginForm" style="display:flex; flex-direction:column; gap:1.2rem;">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="adminEmail" class="form-control" required placeholder="admin@weavessareecollections.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" style="background:var(--admin-primary); color:#FFFFFF; border:none; padding:0.85rem; border-radius:8px; font-weight:700; font-size:0.92rem; cursor:pointer; margin-top:0.5rem; letter-spacing:0.5px;">
                LOG IN TO DASHBOARD
            </button>
        </form>

        <div style="text-align:center; margin-top:1.5rem;">
            <a href="../shop.html" style="color:var(--admin-text-sub); font-size:0.82rem; font-weight:600; text-decoration:none;">← Return to Customer Store</a>
        </div>
    </div>

    <script type="module">
        import { loginUser } from '../js/auth.js';

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                const res = await loginUser(email, password);
                if (res.role === 'admin') {
                    window.location.href = '/admin/index.html';
                } else {
                    alert("Access denied: Account does not have admin privileges.");
                }
            } catch (err) {
                alert("Login failed: " + err.message);
            }
        });
    </script>
</body>
</html>
